name: Build and Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Run tests
        run: go test ./...

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build for Linux ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X github.com/huangzheng2016/eTerm/internal/version.Version=${VERSION} -X github.com/huangzheng2016/eTerm/internal/version.Commit=${COMMIT}" \
            -o eterm_linux_${{ matrix.goarch }} .
      - name: Create archive
        run: tar -czf eterm_linux_${{ matrix.goarch }}.tar.gz eterm_linux_${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.goarch }}
          path: eterm_linux_${{ matrix.goarch }}.tar.gz

  build-darwin:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build for Darwin ${{ matrix.goarch }}
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          COMMIT="${GITHUB_SHA::8}"
          CGO_ENABLED=0 GOARCH=${{ matrix.goarch }} go build \
            -ldflags="-s -w -X github.com/huangzheng2016/eTerm/internal/version.Version=${VERSION} -X github.com/huangzheng2016/eTerm/internal/version.Commit=${COMMIT}" \
            -o eterm_darwin_${{ matrix.goarch }} .
      - name: Create archive
        run: tar -czf eterm_darwin_${{ matrix.goarch }}.tar.gz eterm_darwin_${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7
        with:
          name: darwin-${{ matrix.goarch }}
          path: eterm_darwin_${{ matrix.goarch }}.tar.gz

  build-windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Build for Windows ${{ matrix.goarch }}
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          $version = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "dev" }
          $commit = $env:GITHUB_SHA.Substring(0, 8)
          go build -ldflags="-s -w -X github.com/huangzheng2016/eTerm/internal/version.Version=$version -X github.com/huangzheng2016/eTerm/internal/version.Commit=$commit" -o eterm_windows_${{ matrix.goarch }}.exe .
      - name: Create archive
        shell: pwsh
        run: Compress-Archive -Path "eterm_windows_${{ matrix.goarch }}.exe" -DestinationPath "eterm_windows_${{ matrix.goarch }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.goarch }}
          path: eterm_windows_${{ matrix.goarch }}.zip

  release:
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
      - name: Prepare release files
        run: |
          mkdir -p release
          find . -path ./release -prune -o \( -name "*.tar.gz" -o -name "*.zip" \) -type f -print | while read f; do cp "$f" release/; done
          (cd release && sha256sum *.tar.gz *.zip > SHA256SUMS)
          ls -la release/
      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          files: release/*
          fail_on_unmatched_files: true
