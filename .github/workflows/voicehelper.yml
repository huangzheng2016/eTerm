name: voicehelper Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: cmd/voicehelper/go.sum
      - name: Build and stage
        run: |
          cd cmd/voicehelper
          CGO_ENABLED=1 go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o dist/voicehelper .
          SHERPA_LIB="$(go env GOMODCACHE)/github.com/k2-fsa/sherpa-onnx-go-macos@v1.13.3/lib/aarch64-apple-darwin"
          cp "$SHERPA_LIB"/libsherpa-onnx-c-api.dylib "$SHERPA_LIB"/libonnxruntime.1.24.4.dylib dist/
          cd dist
          ln -sf libonnxruntime.1.24.4.dylib libonnxruntime.dylib
          install_name_tool -add_rpath @executable_path voicehelper
          codesign --sign - --force voicehelper *.dylib
          tar -czf voicehelper-darwin-arm64.tar.gz voicehelper *.dylib
          shasum -a 256 voicehelper-darwin-arm64.tar.gz > voicehelper-darwin-arm64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: voicehelper-darwin-arm64
          path: cmd/voicehelper/dist/voicehelper-darwin-arm64.tar.gz*
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: cmd/voicehelper/dist/voicehelper-darwin-arm64.tar.gz*
          fail_on_unmatched_files: true

  build-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache-dependency-path: cmd/voicehelper/go.sum
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential patchelf
      - name: Build and stage
        run: |
          cd cmd/voicehelper
          CGO_ENABLED=1 go build -ldflags "-X main.version=${GITHUB_REF_NAME}" -o dist/voicehelper .
          SHERPA_LIB="$(go env GOMODCACHE)/github.com/k2-fsa/sherpa-onnx-go-linux@v1.13.3/lib/x86_64-unknown-linux-gnu"
          cp "$SHERPA_LIB"/libsherpa-onnx-c-api.so "$SHERPA_LIB"/libonnxruntime.so dist/
          patchelf --set-rpath '$ORIGIN' dist/voicehelper
          cd dist
          tar -czf voicehelper-linux-amd64.tar.gz voicehelper *.so
          sha256sum voicehelper-linux-amd64.tar.gz > voicehelper-linux-amd64.tar.gz.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: voicehelper-linux-amd64
          path: cmd/voicehelper/dist/voicehelper-linux-amd64.tar.gz*
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: cmd/voicehelper/dist/voicehelper-linux-amd64.tar.gz*
          fail_on_unmatched_files: true
